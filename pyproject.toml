[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-loop"
version = "0.1.0"
description = "Reusable LangGraph ReAct agent harness — terminal loop, image support, interrupt-before-tools approval"
requires-python = ">=3.11"
dependencies = [
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "anthropic>=0.100",
]

[tool.setuptools.packages.find]
where = ["."]
